[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

# Auto-detect remappings so @openzeppelin/* resolves once lib/openzeppelin-contracts is installed.
auto_detect_remappings = true

[rpc_endpoints]
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC}"
arbitrum_one    = "${ARBITRUM_ONE_RPC}"

[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", url = "https://api-sepolia.arbiscan.io/api" }
arbitrum_one    = { key = "${ARBISCAN_API_KEY}", url = "https://api.arbiscan.io/api" }
